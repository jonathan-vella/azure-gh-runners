name: Spike 10 - match custom runner label

on:
  workflow_dispatch:
    inputs:
      spike_nonce:
        description: Unique observer-generated nonce
        required: true
        type: string

run-name: Spike 10 label match - ${{ inputs.spike_nonce }}
permissions: {}
concurrency:
  group: spike10-jit-label-observation
  cancel-in-progress: false

jobs:
  verify-label-match:
    runs-on: ghr-smoke-jit-label-spike
    timeout-minutes: 5
    steps:
      - name: Report selected runner
        run: |
          printf 'Runner name: %s\n' "$RUNNER_NAME"
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          printf 'Runner architecture: %s\n' "$RUNNER_ARCH"
          sleep 45
