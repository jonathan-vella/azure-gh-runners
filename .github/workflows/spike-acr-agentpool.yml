name: Spike - private ACR agent pool

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-context-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: 4b3d5c76-f2d9-49ae-91c2-1455c8ecf95d
      AZURE_TENANT_ID: 30bac921-1547-4b1e-8445-72455da783f1
      AZURE_SUBSCRIPTION_ID: b47d2942-f5ad-4d3c-b28e-c23e4f83d97e
      REGISTRY_NAME: ghrunners6jv20261007
      AGENT_POOL: s2pool-ghrunners6

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build from the GitHub-hosted runner's source context
        shell: bash
        run: |
          set +e
          timeout 720s az acr build \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --registry "$REGISTRY_NAME" \
            --agent-pool "$AGENT_POOL" \
            --file Dockerfile \
            --image "spike/agentpool:source-${GITHUB_SHA}" \
            --timeout 600 \
            image/spike 2>&1 | tee "$RUNNER_TEMP/source-context.log"
          result=${PIPESTATUS[0]}
          echo "Source-context build exit code: ${result}" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Run ID|RunId|Status|ERROR|Error|error|ghcr.io|Succeeded|Failed' \
            "$RUNNER_TEMP/source-context.log" | tail -n 60 || true
          exit 0

      - name: Build from the pinned Git commit
        shell: bash
        run: |
          set +e
          timeout 720s az acr build \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --registry "$REGISTRY_NAME" \
            --agent-pool "$AGENT_POOL" \
            --file image/spike/Dockerfile \
            --image "spike/agentpool:git-${GITHUB_SHA}" \
            --timeout 600 \
            "https://github.com/jonathan-vella/azure-gh-runners.git#${GITHUB_SHA}" \
            2>&1 | tee "$RUNNER_TEMP/git-context.log"
          result=${PIPESTATUS[0]}
          echo "Pinned Git-context build exit code: ${result}" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Run ID|RunId|Status|ERROR|Error|error|ghcr.io|Succeeded|Failed' \
            "$RUNNER_TEMP/git-context.log" | tail -n 60 || true
          exit 0
